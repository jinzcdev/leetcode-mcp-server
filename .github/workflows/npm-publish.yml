name: Publish to NPM

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build package
        run: npm run build
      - name: Check package version matches release
        if: github.event_name == 'release'
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          GITHUB_REF_VERSION=${GITHUB_REF#refs/tags/v}
          if [ "$PKG_VERSION" != "$GITHUB_REF_VERSION" ]; then
            echo "::error::Package version ($PKG_VERSION) does not match release tag ($GITHUB_REF_VERSION)"
            exit 1
          fi
      - name: Check OIDC environment
        run: |
          npm --version
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL" && echo "OIDC request URL present" || echo "OIDC request URL MISSING"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" && echo "OIDC request token present" || echo "OIDC request token MISSING"
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r .value)
          echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq '{repository, repository_owner, workflow_ref, ref, repository_visibility}'
      - name: Publish to NPM
        run: npm publish --provenance --access public --loglevel verbose
